<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohraeil Asaad | Break. Learn. Secure.</title>
<meta name="description" content="Web penetration tester in Suez, Egypt. Break. Learn. Secure.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1030;--navy2:#121a45;--card:#161f52;--pink:#f7a9d3;--blue:#a8c9f7;--text:#eaf0ff;--muted:#a9b4d9;--line:rgba(168,201,247,.18)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;font-weight:300;background:radial-gradient(900px 500px at 85% -5%,rgba(247,169,211,.16),transparent 60%),radial-gradient(800px 600px at 0% 40%,rgba(168,201,247,.10),transparent 60%),var(--navy);color:var(--text);line-height:1.7;font-size:17px}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.05}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:20;background:rgba(10,16,48,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:26px;align-items:center;height:56px;overflow-x:auto;white-space:nowrap}
nav a{text-decoration:none;color:var(--muted);font-size:15px;transition:color .2s}
nav a:hover{color:var(--pink)}
nav .brand{margin-right:auto;display:flex;align-items:center;gap:10px;color:var(--text);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px}
nav .brand img{width:34px;height:34px;border-radius:50%}
.hero{padding:56px 0 30px}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.slogan{font-size:clamp(58px,10.5vw,112px);font-style:italic;letter-spacing:-.01em}
.slogan span{display:block;opacity:0;animation:in .8s ease forwards}
.slogan .w0{color:var(--text);animation:in .8s .1s ease forwards,flick .9s .1s steps(1) 1}
.slogan .w1{color:var(--blue);animation-delay:.8s}
.slogan .w2{color:var(--pink);text-shadow:0 0 28px rgba(247,169,211,.55);animation-delay:1.4s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flick{0%,40%,60%{opacity:.2}20%,50%,80%{opacity:1}}
.who{margin-top:18px;font-size:23px;font-weight:500}
.role{color:var(--blue);margin:2px 0 14px}
.intro{color:var(--muted);max-width:54ch}
.learn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:15px;color:var(--muted)}
.learn i{width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.learn b{font-weight:400;padding:3px 13px;border-radius:999px;border:1px solid rgba(247,169,211,.4);color:var(--text)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{padding:11px 22px;border-radius:999px;text-decoration:none;font-weight:400;font-size:15px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.btn.main{background:linear-gradient(100deg,var(--pink),var(--blue));color:var(--navy);border:0;font-weight:500}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(247,169,211,.25);border-color:var(--pink)}
.logo{width:100%;max-width:400px;justify-self:center;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 0 60px rgba(247,169,211,.28),0 0 120px rgba(168,201,247,.18);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
section{padding:64px 0 8px}
h2{font-size:clamp(32px,4.5vw,46px);margin-bottom:26px;font-style:italic}
h2::after{content:"";display:block;width:56px;height:2px;margin-top:10px;background:linear-gradient(90deg,var(--pink),var(--blue))}
.about{display:grid;grid-template-columns:1.5fr 1fr;gap:40px}
.about p+p{margin-top:14px}
.facts{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:16px}
.facts b{display:block;font-weight:500;color:var(--pink)}
.facts div+div{margin-top:14px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.box{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:22px}
.box h3{font-size:24px;color:var(--blue);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:14px;padding:4px 13px;border-radius:999px;border:1px solid rgba(247,169,211,.35);background:rgba(247,169,211,.07)}
.tl{border-left:2px solid var(--line);margin-left:6px}
.job{position:relative;padding:0 0 34px 28px}
.job::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink)}
.job h3{font-size:27px}
.job .meta{color:var(--blue);font-size:15px;margin-bottom:8px}
.job ul{padding-left:18px;color:var(--muted)}
.job li{margin:3px 0}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.cert{background:var(--navy2);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:10px;padding:16px 18px}
.cert h3{font-family:'Outfit';font-weight:400;font-size:17px;line-height:1.4}
.cert p{color:var(--muted);font-size:15px}
.cert small{color:var(--blue);font-size:14px}
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.proj{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;transition:transform .25s,box-shadow .25s,border-color .25s}
.proj:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 0 30px rgba(247,169,211,.22)}
.proj h3{font-size:28px;margin-bottom:6px}
.proj p{color:var(--muted);font-size:16px}
.proj .tags{margin-top:14px}
.view{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:9px 20px;border-radius:999px;text-decoration:none;font-weight:500;color:var(--navy);background:linear-gradient(100deg,var(--pink),var(--blue));box-shadow:0 0 18px rgba(247,169,211,.3);transition:transform .2s,box-shadow .2s}
.view svg{width:22px;height:22px}
.view:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 30px rgba(168,201,247,.55)}
.contact{display:flex;flex-wrap:wrap;gap:12px}
footer{margin-top:70px;padding:28px 0;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:14px}
.dot{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink);pointer-events:none;z-index:9999;opacity:0;transition:opacity .2s}
.spark{position:fixed;pointer-events:none;z-index:9998;font-size:14px;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(120deg);opacity:0}}
#adminBtn{position:fixed;right:18px;bottom:18px;z-index:50;display:none;padding:10px 18px;border-radius:999px;border:0;background:var(--pink);color:var(--navy);font:500 15px 'Outfit';cursor:pointer}
#adminPanel{position:fixed;inset:0;z-index:60;background:rgba(5,8,24,.85);display:none;place-items:center;padding:16px}
#adminPanel .box{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--navy2)}
#adminPanel h3{font-size:30px;color:var(--text)}
.ed{margin:8px 0}.ed .ed{margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
.ed label,.ed b{display:block;font-size:14px;color:var(--blue);font-weight:400}
.ed b{margin-top:10px;font-size:16px;color:var(--pink)}
.ed input,.ed textarea,#tok{width:100%;margin:3px 0 6px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--navy);color:var(--text);font:inherit;font-size:15px}
.ed textarea{min-height:64px}
.ab{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:400 14px 'Outfit';cursor:pointer;margin:2px 6px 2px 0}
.ab.p{background:var(--pink);color:var(--navy);border:0;font-weight:500}
.bar{position:sticky;bottom:-22px;background:var(--navy2);padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line)}
#st{font-size:14px;color:var(--blue);margin-top:8px}
@media(max-width:760px){.hero .wrap,.about{grid-template-columns:1fr}.logo{max-width:260px;order:-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}.slogan span{opacity:1}.dot,.spark{display:none}}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=u=>/^(https?:\/\/|mailto:)/i.test(u)?u:'#';
const tags=a=>`<div class="tags">${(a||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
function render(){
  const h=D.hero,mail='mailto:'+h.email;
  $('slogan').innerHTML=h.slogan.map((w,i)=>`<span class="w${i}">${esc(w)}</span>`).join('');
  $('role').textContent=h.role;$('intro').textContent=h.intro;
  $('learn').innerHTML=h.learning.length?`<i></i>Now learning:${h.learning.map(x=>`<b>${esc(x)}</b>`).join('')}`:'';
  $('ctaMail').href=mail+'?subject='+encodeURIComponent('Security check request');
  $('aboutP').innerHTML=D.about.p.map(p=>`<p>${esc(p)}</p>`).join('');
  $('facts').innerHTML=D.about.facts.map(f=>`<div><b>${esc(f.k)}</b>${esc(f.v)}</div>`).join('');
  $('skillList').innerHTML=D.skills.map(s=>`<div class="box"><h3>${esc(s.t)}</h3>${tags(s.tags)}</div>`).join('');
  $('expList').innerHTML=D.exp.map(j=>`<div class="job"><h3>${esc(j.t)}</h3><div class="meta">${esc(j.m)}</div><ul>${j.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  $('certList').innerHTML=D.certs.map(c=>`<div class="cert"><h3>${esc(c.t)}</h3><p>${esc(c.i)}</p><small>${esc(c.d)}</small></div>`).join('');
  $('projList').innerHTML=D.projs.map(p=>`<div class="proj"><h3>${esc(p.t)}</h3><p>${esc(p.i)}</p>${tags(p.g)}<a class="view" href="${esc(url(p.l))}" target="_blank" rel="noopener" aria-label="View ${esc(p.t)} on GitHub">${GH}<span>View on GitHub</span></a></div>`).join('');
  $('contactList').innerHTML=`<a class="btn main" href="${esc(mail)}">Email me</a>`+D.contact.map(c=>`<a class="btn" href="${esc(url(c.u))}" target="_blank" rel="noopener">${esc(c.n)}</a>`).join('');
}
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);
{const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}

// cursor: system cursor stays; pink dot + sparkles follow
const dot=$('dot'),icons=['✨','⭐','💫','🔐','🩷'];let last=0;
if(matchMedia('(pointer:fine)').matches)addEventListener('pointermove',e=>{
  dot.style.opacity=1;dot.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
  const n=performance.now();if(n-last<70)return;last=n;
  const s=document.createElement('span');s.className='spark';s.textContent=icons[Math.random()*icons.length|0];
  s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
  s.style.setProperty('--dx',(Math.random()*60-30)+'px');s.style.setProperty('--dy',(Math.random()*50+10)+'px');
  document.body.appendChild(s);setTimeout(()=>s.remove(),900);
});

// ---- Admin: hidden (hold M + A + S). Publishing needs YOUR GitHub token, so only you can change the live site. ----
const down=new Set(),btn=$('adminBtn'),panel=$('adminPanel'),box=$('adminBox');
addEventListener('keydown',e=>{down.add(e.key.toLowerCase());if(down.has('m')&&down.has('a')&&down.has('s'))btn.style.display='block'});
addEventListener('keyup',e=>down.delete(e.key.toLowerCase()));
const NAMES={hero:'Top section',slogan:'Slogan words',role:'Role line',intro:'Intro text',learning:'Now learning',email:'Email',about:'About',p:'Paragraphs',facts:'Side facts',k:'Label',v:'Text',skills:'Skills',t:'Title',tags:'Tags',exp:'Experience',m:'Company & dates',b:'Bullet points',certs:'Certifications',i:'Description',d:'Date',projs:'Projects',l:'GitHub link',g:'Tags',contact:'Contact links',n:'Name',u:'Link'};
const blank=v=>typeof v==='string'?'':Array.isArray(v)?[]:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,blank(x)]));
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ab=(t,f,c)=>{const b=mk('button','ab'+(c?' '+c:''),t);b.type='button';b.onclick=f;return b};
function ed(parent,obj,key,label){
  const v=obj[key],w=mk('div','ed');
  if(typeof v==='string'){const l=mk('label',0,label),i=mk(v.length>70?'textarea':'input');i.value=v;i.oninput=()=>{obj[key]=i.value;render()};l.appendChild(i);w.appendChild(l)}
  else if(Array.isArray(v)){w.appendChild(mk('b',0,label));
    v.forEach((x,n)=>{const r=mk('div');ed(r,v,n,typeof x==='string'?label+' '+(n+1):'#'+(n+1));r.appendChild(ab('Remove',()=>{v.splice(n,1);render();draw()}));w.appendChild(r)});
    w.appendChild(ab('+ Add',()=>{v.push(v.length?blank(v[0]):'');render();draw()}))}
  else{Object.keys(v).forEach(k=>ed(w,v,k,NAMES[k]||k))}
  parent.appendChild(w)}
function draw(){
  box.innerHTML='';box.appendChild(mk('h3',0,'Edit your portfolio'));
  if(!sessionStorage.getItem('gh_token')){
    box.appendChild(mk('p',0,'Paste your GitHub token to unlock editing. It stays in this tab only and is never saved in the site.'));
    const t=mk('input');t.id='tok';t.type='password';t.autocomplete='off';box.appendChild(t);
    box.appendChild(ab('Unlock',()=>{if(t.value.trim()){sessionStorage.setItem('gh_token',t.value.trim());draw()}},'p'));
    box.appendChild(ab('Close',()=>panel.style.display='none'));return}
  Object.keys(D).forEach(k=>ed(box,D,k,NAMES[k]||k));
  const bar=mk('div','bar'),st=mk('div');st.id='st';
  bar.append(ab('Publish to my site',publish,'p'),ab('Lock',()=>{sessionStorage.removeItem('gh_token');draw()}),ab('Close',()=>panel.style.display='none'),st);box.appendChild(bar)}
async function publish(){
  const st=$('st'),tk=sessionStorage.getItem('gh_token'),api=`https://api.github.com/repos/${REPO}/contents/content.json`,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
  st.textContent='Publishing…';
  try{
    const g=await fetch(api+'?ref='+BRANCH,{headers:H});let sha;
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw Error(g.status===401||g.status===403?'GitHub rejected the token. Check it and its permissions.':'GitHub error '+g.status);
    const body={message:'Update portfolio content',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2)))),branch:BRANCH};if(sha)body.sha=sha;
    const p=await fetch(api,{method:'PUT',headers:H,body:JSON.stringify(body)});
    if(!p.ok)throw Error(p.status===404?'Repo not found. Check REPO in index.html.':'GitHub error '+p.status);
    st.textContent='Published. Visitors will see it in a minute or two.';
  }catch(e){st.textContent=e.message}}
btn.onclick=()=>{panel.style.display='grid';draw()};
</script>
